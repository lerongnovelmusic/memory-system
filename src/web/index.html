<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>记忆系统 · 测试实例</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🐟</div>
      <div>
        <div class="brand-name">测试鱼 T-01</div>
        <div class="brand-sub">记忆系统 · 测试实例</div>
      </div>
    </div>
    <div class="side-label">今天</div>
    <button class="session today" id="sessionToday" data-id="">
      <span class="dot"></span>
      <span class="session-text">正在聊</span>
    </button>
    <div class="side-label">最近 7 天</div>
    <div id="sessionList" class="session-list"></div>
    <div class="side-foot">
      <div id="memoryPulse" class="pulse">记忆库读取中…</div>
      <div id="scheduleLine" class="pulse dim"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <nav class="tabs">
        <button class="tab active" data-view="chat">聊天</button>
        <button class="tab" data-view="memory">记忆</button>
        <button class="tab" data-view="eval">体检</button>
      </nav>
      <div class="topbar-right">
        <span id="tokenBadge" class="badge">— token</span>
        <button id="modelBadge" class="badge dim clickable" title="点这里配置 API">—</button>
        <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
      </div>
    </header>

    <section id="view-chat" class="view active">
      <div id="readonlyBanner" class="banner hidden">这是历史会话，只读。想接着聊，请回到今天。</div>
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="和她说点什么…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button type="submit" id="sendBtn">发送</button>
      </form>
    </section>

    <section id="view-memory" class="view">
      <div id="statCards" class="cards"></div>
      <div class="toolbar">
        <input id="memorySearch" placeholder="搜一条记忆（走混合检索）" />
        <select id="tierFilter">
          <option value="">全部层</option>
          <option value="core">core · 核心（人格/契约，每轮注入）</option>
          <option value="warm">warm · 常用（这阵子用的，提到才注入）</option>
          <option value="cache2">cache2 · 待定（刚记下的，还没检验）</option>
          <option value="l4">l4 · 底层（最久的事，满了才淘汰）</option>
        </select>
        <button id="consolidateBtn" class="primary">立即巩固</button>
        <button id="pauseBtn" class="ghost">暂停自动巩固</button>
        <label class="chk"><input type="checkbox" id="showTombstones" /> 显示已遗忘</label>
        <span id="pinQuota" class="hint"></span>
      </div>
      <div class="memory-layout">
        <div id="eventList" class="event-list"></div>
        <div id="detail" class="detail">
          <div class="empty">点左边任意一条，看她为什么记得。</div>
        </div>
      </div>
    </section>

    <section id="view-eval" class="view">
      <div class="toolbar">
        <select id="evalMode">
          <option value="dry">dry · 只判检索</option>
          <option value="full">full · 真回答 + 判分</option>
        </select>
        <button id="runEval" class="primary">跑一次体检</button>
        <button id="setBaseline" class="ghost">跑一次并设为基线</button>
        <span id="evalHint" class="hint">dry 不生成回答，几秒钟；full 需要接模型。</span>
      </div>
      <div id="evalBaseline" class="eval-baseline"></div>
      <div id="evalTrend" class="eval-trend"></div>
      <div id="evalResult" class="eval-result">
        <div class="empty">还没跑。点上面的按钮。</div>
      </div>
    </section>
  </main>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-box">
      <h3>接入模型</h3>
      <p class="modal-hint">填 OpenAI 兼容的接口即可（DeepSeek / 通义 / 本地 Ollama / vLLM）。保存后立刻生效，不用重启。</p>
      <label>API Key
        <input id="cfgKey" type="password" autocomplete="off" placeholder="sk-..." />
      </label>
      <label>Base URL
        <input id="cfgBase" type="text" placeholder="https://api.deepseek.com" />
      </label>
      <label>模型
        <input id="cfgModel" type="text" placeholder="deepseek-chat" />
      </label>
      <div id="cfgMsg" class="cfg-msg"></div>
      <div class="modal-actions">
        <button id="cfgTest" class="ghost">测试连接</button>
        <button id="cfgSave" class="primary">保存</button>
        <button id="cfgClose" class="ghost">关闭</button>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
